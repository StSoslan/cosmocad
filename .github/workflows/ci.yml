# Автоматическая сборка и тесты при каждом изменении кода.
# Задание для Linux повторяет команды, которыми проект собран и проверен.
# Сборка, тесты и установщик для Windows — в installer.yml.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev \
            libgtest-dev nlohmann-json3-dev python3 libtbb-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev libocct-ocaf-dev libocct-visualization-dev
      - name: Настроить
        run: cmake --preset ci
      - name: Собрать
        run: cmake --build --preset ci
      - name: Тесты
        run: ctest --preset ci
        env:
          QT_QPA_PLATFORM: offscreen
